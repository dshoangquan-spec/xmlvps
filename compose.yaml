name: xulyxml-stack

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: xulyxml-app
    restart: unless-stopped
    init: true
    env_file: [.env]
    networks:
      - backend-network
      - shared-db-network
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:3000"]
      interval: 30s
      timeout: 5s
      retries: 3
    mem_limit: 400m
    mem_reservation: 128m
    cpus: "0.50"
    pids_limit: 150
    deploy:
      resources:
        limits:
          memory: 400M
          cpus: "0.50"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend-network:
    external: true
  shared-db-network:
    external: true
