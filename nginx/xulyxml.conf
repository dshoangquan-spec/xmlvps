# Nginx Server Block cho Ứng dụng Xử lý XML trên VPS
# Đặt tại /home/dsquan/apps/nginx/conf.d/xulyxml.conf trên VPS

server {
    listen 80;
    server_name xml.tndcloud.com; # Thay bằng tên miền / subdomain của anh

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name xml.tndcloud.com; # Thay bằng tên miền / subdomain của anh

    ssl_certificate     /etc/letsencrypt/live/xml.tndcloud.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/xml.tndcloud.com/privkey.pem;

    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options DENY;
    add_header Referrer-Policy strict-origin-when-cross-origin;

    # Cho phép upload file zip / xml lớn
    client_max_body_size 50M;

    location / {
        proxy_pass http://xulyxml-app:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
